<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Learning Website - Registration</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f0f8ff; }
    h1 { color: #ff6f61; }
    form { background: #ffffff; padding: 20px; border-radius: 8px; max-width: 450px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    div { margin-bottom: 12px; }
    label { font-weight: bold; display: block; margin-bottom: 4px; }
    input[type="text"], input[type="password"], input[type="number"], input[type="email"], select {
      width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
    }
    .checkbox-group, .radio-group { font-weight: normal; }
    button { background-color: #ff6f61; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #e05548; }
  </style>
</head>
<body>

  <h1>Kids Learning Website - Registration Form</h1>

  <form action="/server" method="post">
    <div>
      <label for="name">Kid's Name:</label>
      <input type="text" id="name" name="name" required placeholder="e.g., John David">
    </div>

    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
    </div>

    <div>
      <label for="age">Age (3–15 years):</label>
      <input type="number" id="age" name="age" min="3" max="15" required placeholder="e.g., 8">
    </div>

    <div>
      <label for="mobile">Parent's Mobile Number:</label>
      <input type="text" id="mobile" name="mobile" pattern="[0-9]{10}" required placeholder="10-digit phone number">
    </div>

    <div>
      <label for="email">Parent's Email:</label>
      <input type="email" id="email" name="email" required placeholder="e.g., parent@gmail.com">
    </div>

    <div>
      <label>Gender:</label>
      <input type="radio" id="male" name="gender" value="Male" required> <label for="male" style="display:inline;">Male</label>
      <input type="radio" id="female" name="gender" value="Female"> <label for="female" style="display:inline;">Female</label>
    </div>

    <div>
      <label for="state">State:</label>
      <select id="state" name="state" required>
        <option value="">--Select State--</option>
        <option value="Kerala">Kerala</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Maharashtra">Maharashtra</option>
      </select>
    </div>

    <div>
      <label>Learning Subjects / Skills:</label>
      <input type="checkbox" name="skills" value="Phonics & Reading"> Phonics & Reading<br>
      <input type="checkbox" name="skills" value="Fun Math & Logic"> Fun Math & Logic<br>
      <input type="checkbox" name="skills" value="Basic Coding / Scratch"> Basic Coding / Scratch<br>
      <input type="checkbox" name="skills" value="Science Experiments"> Science Experiments
    </div>

    <button type="submit">Submit & Register</button>
  </form>

</body>
</html>
